<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="700" viewBox="0 0 1680 700" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="gsynergy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1EF074"/>
      <stop offset="1" stop-color="#1ECAFA"/>
    </linearGradient>
    <filter id="ssynergy" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0A2540" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowUp_synergy" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L16,9 L2,16 Z" fill="#0EA5C4"/>
    </marker>
    <marker id="arrowBack_synergy" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L16,9 L2,16 Z" fill="#00CE90"/>
    </marker>
    <marker id="arrowShare_synergy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  

  <rect x="24" y="24" width="1632" height="96" rx="18" fill="url(#gsynergy)"/>
  <text x="56" y="70" font-size="30" font-weight="800" fill="#FFFFFF">상급종합병원과 지역 안과, 경쟁이 아니라 분업</text>
  <text x="56" y="100" font-size="15" font-weight="500" fill="#FFFFFF" opacity="0.92">Refer-up · Refer-back · 표준 결과 공유</text>
  <rect x="1352" y="50" width="236" height="44" rx="22" fill="#FFFFFF" opacity="0.18"/>
  <text x="1470" y="78" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">양방향 분업 모델</text>

  <rect x="500" y="154" width="680" height="122" rx="15" fill="#FFFFFF" stroke="#E6E9EF" stroke-width="1.5" filter="url(#ssynergy)"/>
  <rect x="500" y="154" width="680" height="7" rx="3.5" fill="#0EA5C4"/>
  <circle cx="552" cy="215" r="28" fill="#0EA5C4" opacity="0.12"/>
  <path d="M539 218 H565 M552 205 V231" stroke="#0EA5C4" stroke-width="7" stroke-linecap="round"/>
  <text x="600" y="207" font-size="28" font-weight="800" fill="#1A2230">상급종합병원</text>
  <text x="600" y="238" font-size="17" font-weight="500" fill="#4A5568">중증·수술·연구 / 임상시험 primary endpoint</text>

  <rect x="600" y="315" width="480" height="94" rx="16" fill="url(#gsynergy)" filter="url(#ssynergy)"/>
  <text x="840" y="354" font-size="29" font-weight="800" fill="#FFFFFF" text-anchor="middle">애프터눈</text>
  <text x="840" y="384" font-size="16" font-weight="500" fill="#FFFFFF" opacity="0.94" text-anchor="middle">표준 의뢰·회신·결과 공유의 연결고리</text>

  <rect x="450" y="482" width="780" height="130" rx="16" fill="#F7FBFA" stroke="#E6E9EF" stroke-width="1.5" filter="url(#ssynergy)"/>
  <rect x="450" y="482" width="780" height="7" rx="3.5" fill="#00CE90"/>
  <circle cx="510" cy="547" r="31" fill="#00CE90" opacity="0.14"/>
  <path d="M495 555 C501 536 519 536 525 555 M502 533 C502 522 518 522 518 533" fill="none" stroke="#00CE90" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="570" y="537" font-size="31" font-weight="800" fill="#1A2230">지역 안과</text>
  <text x="570" y="570" font-size="18" font-weight="500" fill="#4A5568">선별·정기검진·안정기 추적 / 접근성·연속성</text>

  <path d="M575 482 C520 418 540 329 626 277" fill="none" stroke="#0EA5C4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowUp_synergy)"/>
  <rect x="82" y="332" width="420" height="78" rx="15" fill="#FFFFFF" stroke="#E6E9EF" stroke-width="1.5" filter="url(#ssynergy)"/>
  <rect x="82" y="332" width="420" height="7" rx="3.5" fill="#0EA5C4"/>
  <text x="112" y="365" font-size="16" font-weight="800" fill="#0EA5C4">지역→상급 신속 의뢰</text>
  <text x="112" y="391" font-size="17" font-weight="700" fill="#1A2230">시력위협 소견(증식 DR·황반부종 등) 신속 의뢰</text>

  <path d="M1048 277 C1168 339 1204 419 1110 482" fill="none" stroke="#00CE90" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBack_synergy)"/>
  <rect x="1174" y="334" width="424" height="88" rx="16" fill="#F7FBFA" stroke="#E6E9EF" stroke-width="1.5" filter="url(#ssynergy)"/>
  <rect x="1174" y="334" width="424" height="7" rx="3.5" fill="#00CE90"/>
  <text x="1204" y="370" font-size="18" font-weight="800" fill="#00CE90">상급→지역 회송 강조</text>
  <text x="1204" y="398" font-size="22" font-weight="800" fill="#1A2230">치료 후 안정기·정기 추적 회송</text>

  <path d="M720 292 L760 315" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#arrowShare_synergy)"/>
  <path d="M960 409 L1010 460" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#arrowShare_synergy)"/>
  <rect x="565" y="423" width="550" height="43" rx="21.5" fill="#FFFFFF" stroke="#E6E9EF" stroke-width="1.5"/>
  <text x="840" y="451" font-size="17" font-weight="700" fill="#4A5568" text-anchor="middle">표준 결과지로 양쪽이 같은 정보 공유 → 중복검사·정보 단절 해소</text>

  <rect x="326" y="632" width="1028" height="44" rx="22" fill="url(#gsynergy)" filter="url(#ssynergy)"/>
  <text x="840" y="661" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">지역 안과 환자가 상급으로 흘러나가는 것이 아니라, 상급의 안정기 환자가 지역으로 돌아옵니다</text>
</svg>
