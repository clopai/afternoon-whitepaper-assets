    <text x="840" y="568" font-size="14" font-weight="500" fill="#94A3B8" text-anchor="middle">근거: 식약처 「지역 의료기관 임상시험 참여 확대방안」(2024-04-12). 글로벌 제약사 트랙 reference case 논의·검토 단계 — 계약·운영 단정 아님.</text>
